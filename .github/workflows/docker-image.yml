name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: pass secret
      with: # Set the secret as an input
          api_keys: ${{ secrets.API_KEYS }}
      uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build --build-arg=arg_automation_framework=${{ secrets.AUTOMATION_FRAMEWORK_DUMMY }} -t qatests . && docker run -v ./reports/playwright:/usr/src/app/reports/playwright qatests -s test_execute/login/test_login.py
