name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build --build-arg=arg_automation_framework=playwright -t qatests . && docker run -v ./reports/playwright:/usr/src/app/reports/playwright qatests -s test_execute/login/test_login.py
