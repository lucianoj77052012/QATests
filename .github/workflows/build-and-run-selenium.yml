name: Build and run selenium tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Create API Keys
      run: bash ./.github/workflows/create_api_keys.sh ${{ secrets.API_KEYS }}
    - name: Build the Docker image
      run: docker build --build-arg=arg_automation_framework=selenium -t qatests . && docker run -v ./reports/selenium:/usr/src/app/reports/selenium qatests -s
    - name: Archive test output screenshot report
      uses: actions/upload-artifact@v4
      with:
        name: test-output-screenshot-report
        path: reports/selenium/*.png
